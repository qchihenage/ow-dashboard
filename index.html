<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overwatch 英雄强度看板</title>
  <!-- ECharts 图表库（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root {
      --surface:   #fcfcfb;
      --page:      #f9f9f7;
      --ink:       #0b0b0b;
      --ink-2:     #52514e;
      --muted:     #898781;
      --grid:      #e1e0d9;
      --axis:      #c3c2b7;
      --border:    rgba(11,11,11,0.10);
      --blue:      #2a78d6;
      --orange:    #eb6834;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--grid);
      background: var(--surface);
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 650;
      letter-spacing: 0.2px;
    }
    header .subtitle {
      font-size: 13px;
      color: var(--ink-2);
      margin-left: 12px;
      font-weight: 400;
    }

    .filters {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filters label {
      font-size: 13px;
      color: var(--ink-2);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filters select {
      font: inherit;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid var(--axis);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 28px 40px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
    }
    .card h2 {
      font-size: 15px;
      margin: 0 0 4px;
      font-weight: 650;
    }
    .card .hint {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      align-items: start;
    }

    #winrate-chart { width: 100%; height: 520px; }

    .rank-list { max-height: 520px; overflow-y: auto; }
    .grade-group { margin-bottom: 10px; }
    .grade-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-2);
      padding: 4px 6px;
      border-bottom: 1px solid var(--grid);
      margin-bottom: 4px;
    }
    .grade-badge {
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 5px;
      font-weight: 700;
      font-size: 12px;
      color: #fff;
    }
    .hero-row {
      display: grid;
      grid-template-columns: 1fr 44px 52px 56px;
      gap: 6px;
      align-items: center;
      padding: 5px 6px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
    }
    .hero-row:hover { background: var(--grid); }
    .hero-row.active { background: var(--seq-150, #b7d3f6); }
    .hero-row .name { font-weight: 550; }
    .hero-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
    .hero-row .score { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .col-head {
      display: grid;
      grid-template-columns: 1fr 44px 52px 56px;
      gap: 6px;
      padding: 2px 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .col-head span { text-align: right; }
    .col-head span:first-child { text-align: left; }

    .trend-panel {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 20px;
      align-items: start;
    }
    .trend-head {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 8px;
    }
    .trend-hint { grid-column: 1 / -1; }
    .trend-panel .chart { width: 100%; height: 260px; }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 16px 0 32px;
    }
    footer a { color: var(--blue); }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .trend-panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Overwatch 英雄强度看板<span class="subtitle">数据源：暴雪官方英雄数据页 · 每周自动更新</span></h1>
    </div>
    <div class="filters">
      <label>服务器
        <select id="region-select"></select>
      </label>
      <label>赛季
        <select id="season-select"></select>
      </label>
      <label>段位
        <select id="tier-select"></select>
      </label>
    </div>
  </header>

  <main>
    <!-- 柱状图 + 强度排行 -->
    <div class="grid">
      <section class="card">
        <h2>英雄胜率分布</h2>
        <p class="hint">柱长 = 胜率；柱色深浅 = 出场率（越深出场率越高）。点击柱子查看该英雄历史趋势。</p>
        <div id="winrate-chart"></div>
      </section>

      <aside class="card">
        <h2>强度梯度排行</h2>
        <p class="hint" id="rank-hint">综合强度 = 0.6×胜率 + 0.4×出场率（归一化）</p>
        <div class="col-head">
          <span>英雄</span><span>胜率</span><span>出场</span><span>评分</span>
        </div>
        <div class="rank-list" id="rank-list"></div>
      </aside>
    </div>

    <!-- 单英雄历史趋势 -->
    <section class="card trend-panel">
      <div class="trend-head">
        <h2 style="margin:0;">单英雄历史趋势</h2>
        <label style="margin-left:auto;">英雄
          <select id="hero-select"></select>
        </label>
      </div>
      <p class="hint trend-hint">当前服务器 + 段位下该英雄的胜率 / 出场率随快照日期的变化（数据每周累积）。</p>
      <div class="chart" id="trend-winrate"></div>
      <div class="chart" id="trend-pickrate"></div>
    </section>
  </main>

  <footer>
    作品展示项目 · 数据由 GitHub Actions 每周自动抓取并更新 · 详见项目 README
  </footer>

  <script>
    // =====================================================================
    // 看板逻辑
    // =====================================================================
    const DATA_URL = 'data/dashboard_data.json';

    let DATA = null;
    let state = { season: null, region: 'Asia', tier: 'All', hero: null };

    let barChart, winChart, pickChart;

    // 梯度 S/A/B/C/D -> 单色单调明度色阶（S 最深、D 最浅）
    const GRADE_COLOR = { S: '#184f95', A: '#2a78d6', B: '#5598e7', C: '#86b6ef', D: '#b7d3f6' };

    // 服务器/段位的中文名
    const REGION_NAMES = { Asia: '亚洲', Americas: '美洲', Europe: '欧洲' };
    const TIER_NAMES = { All: '全段位', Bronze: '青铜', Silver: '白银', Gold: '黄金',
                         Platinum: '铂金', Emerald: '翡翠', Diamond: '钻石',
                         Master: '大师', Grandmaster: '宗师' };

    // ---------- 初始化 ----------
    async function init() {
      const resp = await fetch(DATA_URL);
      if (!resp.ok) throw new Error('无法加载数据: ' + DATA_URL + '（本地预览请用 python -m http.server 启动）');
      DATA = await resp.json();

      state.season = DATA.meta.season;
      state.region = DATA.meta.regions.includes('Asia') ? 'Asia' : DATA.meta.regions[0];
      state.tier = DATA.meta.tiers.includes('All') ? 'All' : DATA.meta.tiers[0];

      populateFilters();
      state.hero = (DATA.region_data[state.region][state.tier] || [])[0].hero_id;

      barChart = echarts.init(document.getElementById('winrate-chart'));
      winChart = echarts.init(document.getElementById('trend-winrate'));
      pickChart = echarts.init(document.getElementById('trend-pickrate'));

      bindEvents();
      render();
      window.addEventListener('resize', () => {
        barChart.resize(); winChart.resize(); pickChart.resize();
      });
    }

    function populateFilters() {
      const regionSel = document.getElementById('region-select');
      regionSel.innerHTML = DATA.meta.regions
        .map(r => `<option value="${r}">${REGION_NAMES[r] || r}</option>`).join('');
      regionSel.value = state.region;

      const seasonSel = document.getElementById('season-select');
      seasonSel.innerHTML = DATA.meta.seasons.map(s => `<option value="${s}">${s}</option>`).join('');
      seasonSel.value = state.season;

      const tierSel = document.getElementById('tier-select');
      tierSel.innerHTML = DATA.meta.tiers
        .map(t => `<option value="${t}">${TIER_NAMES[t] || t}</option>`).join('');
      tierSel.value = state.tier;

      const heroSel = document.getElementById('hero-select');
      const names = Object.entries(DATA.heroes)
        .map(([id, h]) => ({ id, name: h.name }))
        .sort((a, b) => a.name.localeCompare(b.name));
      heroSel.innerHTML = names.map(n => `<option value="${n.id}">${n.name}</option>`).join('');
    }

    function bindEvents() {
      document.getElementById('region-select').addEventListener('change', e => {
        state.region = e.target.value;
        render();
      });
      document.getElementById('tier-select').addEventListener('change', e => {
        state.tier = e.target.value;
        render();
      });
      document.getElementById('season-select').addEventListener('change', e => {
        state.season = e.target.value;
        render();
      });
      document.getElementById('hero-select').addEventListener('change', e => {
        state.hero = e.target.value;
        renderTrend();
        renderRankList();
      });
    }

    function render() {
      renderBar();
      renderRankList();
      renderTrend();
    }

    // 当前筛选切片下的英雄数据（按综合强度降序）
    function currentEntries() {
      return (DATA.region_data[state.region] || {})[state.tier] || [];
    }

    // ---------- 1. 胜率柱状图（柱色深浅 = 出场率） ----------
    function renderBar() {
      const entries = currentEntries();
      const globalMaxPick = maxPickrateAcrossAll();

      // 用 dataset + encode 明确指定各维度角色，避免 visualMap 对
      // 二维数组 data 的歧义解析（这是之前只显示一位英雄的根因）。
      barChart.setOption({
        dataset: {
          source: entries.map(e => ({
            name: e.name, winrate: e.winrate, pickrate: e.pickrate, hero_id: e.hero_id
          }))
        },
        grid: { left: 44, right: 16, top: 20, bottom: 60 },
        tooltip: {
          trigger: 'item',
          backgroundColor: '#ffffff',
          borderColor: '#e1e0d9',
          textStyle: { color: '#0b0b0b', fontSize: 13 },
          formatter: p => `<b>${p.data.name}</b><br/>胜率 ${p.data.winrate.toFixed(1)}%<br/>出场率 ${p.data.pickrate.toFixed(1)}%`
        },
        xAxis: {
          type: 'category',
          axisLine: { lineStyle: { color: '#c3c2b7' } },
          axisTick: { show: false },
          axisLabel: { color: '#898781', fontSize: 11, rotate: 55, interval: 0 }
        },
        yAxis: {
          type: 'value', name: '胜率 %',
          min: 30, max: 65,
          nameTextStyle: { color: '#898781' },
          axisLine: { show: false },
          splitLine: { lineStyle: { color: '#e1e0d9' } },
          axisLabel: { color: '#898781' }
        },
        visualMap: {
          type: 'continuous', min: 0, max: globalMaxPick,
          dimension: 'pickrate',          // 用 dataset 维度名着色
          inRange: { color: ['#cde2fb', '#0d366b'] },
          orient: 'horizontal', left: 'center', bottom: 0,
          itemWidth: 12, itemHeight: 120,
          text: ['出场率 高', '低'],
          textStyle: { color: '#898781', fontSize: 11 },
          calculable: false
        },
        series: [{
          type: 'bar',
          encode: { x: 'name', y: 'winrate' },
          barMaxWidth: 22,
          itemStyle: { borderRadius: [3, 3, 0, 0] }
        }]
      }, true);

      barChart.off('click');
      barChart.on('click', p => {
        if (p.data && p.data.hero_id) {
          state.hero = p.data.hero_id;
          document.getElementById('hero-select').value = state.hero;
          renderTrend();
          renderRankList();
        }
      });
    }

    function maxPickrateAcrossAll() {
      let m = 0;
      for (const region in DATA.region_data) {
        for (const tier in DATA.region_data[region]) {
          for (const e of DATA.region_data[region][tier]) m = Math.max(m, e.pickrate);
        }
      }
      return Math.ceil(m);
    }

    // ---------- 2. 强度梯度排行侧边栏（表格视图） ----------
    function renderRankList() {
      const entries = currentEntries();
      const grades = ['S', 'A', 'B', 'C', 'D'];
      const listEl = document.getElementById('rank-list');
      document.getElementById('rank-hint').textContent =
        `综合强度 = 0.6×胜率 + 0.4×出场率（归一化）· 共 ${entries.length} 位英雄`;

      let html = '';
      for (const g of grades) {
        const group = entries.filter(e => e.grade === g);
        if (!group.length) continue;
        html += `<div class="grade-group">`;
        html += `<div class="grade-head"><span class="grade-badge" style="background:${GRADE_COLOR[g]}">${g}</span>${group.length} 位</div>`;
        for (const e of group) {
          const active = e.hero_id === state.hero ? ' active' : '';
          html += `
            <div class="hero-row${active}" data-hero="${e.hero_id}">
              <span class="name">${e.name}</span>
              <span class="num">${e.winrate.toFixed(1)}</span>
              <span class="num">${e.pickrate.toFixed(1)}</span>
              <span class="score">${e.score.toFixed(1)}</span>
            </div>`;
        }
        html += `</div>`;
      }
      listEl.innerHTML = html;

      listEl.querySelectorAll('.hero-row').forEach(row => {
        row.addEventListener('click', () => {
          state.hero = row.dataset.hero;
          document.getElementById('hero-select').value = state.hero;
          renderTrend();
          renderRankList();
        });
      });
    }

    // ---------- 3. 单英雄历史趋势（两个单指标小多图，避免双轴） ----------
    function renderTrend() {
      const hero = state.hero;
      const series = ((DATA.history[hero] || {})[state.region] || {})[state.tier] || [];
      const dates = series.map(s => s.date);
      const winrates = series.map(s => s.winrate);
      const pickrates = series.map(s => s.pickrate);

      winChart.setOption({
        title: { text: '胜率走势 (%)', left: 0, top: 0, textStyle: { fontSize: 13, color: '#52514e', fontWeight: 600 } },
        grid: { left: 44, right: 16, top: 30, bottom: 30 },
        tooltip: {
          trigger: 'axis', backgroundColor: '#fff', borderColor: '#e1e0d9',
          textStyle: { color: '#0b0b0b' },
          formatter: ps => {
            const s = series[ps[0].dataIndex];
            return `${dates[ps[0].dataIndex]}<br/>胜率 ${s.winrate.toFixed(1)}%`;
          }
        },
        xAxis: { type: 'category', data: dates, boundaryGap: false,
          axisLine: { lineStyle: { color: '#c3c2b7' } }, axisTick: { show: false },
          axisLabel: { color: '#898781', fontSize: 11 } },
        yAxis: { type: 'value', min: 35, max: 65,
          splitLine: { lineStyle: { color: '#e1e0d9' } }, axisLabel: { color: '#898781' } },
        series: [{
          type: 'line', data: winrates, smooth: true,
          symbol: 'circle', symbolSize: 8, showSymbol: true,
          lineStyle: { color: '#2a78d6', width: 2 },
          itemStyle: { color: '#2a78d6' },
          areaStyle: { color: 'rgba(42,120,214,0.08)' }
        }]
      }, true);

      pickChart.setOption({
        title: { text: '出场率走势 (%)', left: 0, top: 0, textStyle: { fontSize: 13, color: '#52514e', fontWeight: 600 } },
        grid: { left: 44, right: 16, top: 30, bottom: 30 },
        tooltip: {
          trigger: 'axis', backgroundColor: '#fff', borderColor: '#e1e0d9',
          textStyle: { color: '#0b0b0b' },
          formatter: ps => {
            const s = series[ps[0].dataIndex];
            return `${dates[ps[0].dataIndex]}<br/>出场率 ${s.pickrate.toFixed(1)}%`;
          }
        },
        xAxis: { type: 'category', data: dates, boundaryGap: false,
          axisLine: { lineStyle: { color: '#c3c2b7' } }, axisTick: { show: false },
          axisLabel: { color: '#898781', fontSize: 11 } },
        yAxis: { type: 'value', min: 0, max: 70,
          splitLine: { lineStyle: { color: '#e1e0d9' } }, axisLabel: { color: '#898781' } },
        series: [{
          type: 'line', data: pickrates, smooth: true,
          symbol: 'circle', symbolSize: 8, showSymbol: true,
          lineStyle: { color: '#eb6834', width: 2 },
          itemStyle: { color: '#eb6834' },
          areaStyle: { color: 'rgba(235,104,52,0.08)' }
        }]
      }, true);
    }

    init().catch(err => {
      document.body.innerHTML = `<div style="padding:40px;font-family:system-ui;">${err.message}</div>`;
    });
  </script>
</body>
</html>
