<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overwatch 英雄强度看板</title>
  <!-- ECharts 图表库（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    /* ============ 设计变量（取自校验过的数据可视化调色板） ============
       - 页面/表面、墨色、网格线、坐标轴等角色统一用变量引用，
         便于日后整体替换主题（例如深色模式）。 */
    :root {
      --surface:   #fcfcfb;   /* 卡片表面 */
      --page:      #f9f9f7;   /* 页面背景 */
      --ink:       #0b0b0b;   /* 主文字 */
      --ink-2:     #52514e;   /* 次级文字 */
      --muted:     #898781;   /* 轴标签等弱化文字 */
      --grid:      #e1e0d9;   /* 网格线（发丝） */
      --axis:      #c3c2b7;   /* 坐标轴线 */
      --border:    rgba(11,11,11,0.10);
      --blue:      #2a78d6;   /* 分类色 1：蓝 */
      --orange:    #eb6834;   /* 分类色 2：橙 */
      /* 顺序色阶（蓝，浅→深，用于「出场率」与「强度梯度」的有序编码） */
      --seq-150:   #b7d3f6;
      --seq-250:   #86b6ef;
      --seq-350:   #5598e7;
      --seq-450:   #2a78d6;
      --seq-600:   #184f95;
      --seq-700:   #0d366b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--grid);
      background: var(--surface);
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 650;
      letter-spacing: 0.2px;
    }
    header .subtitle {
      font-size: 13px;
      color: var(--ink-2);
      margin-left: 12px;
      font-weight: 400;
    }

    /* 筛选行：统一放在图表上方 */
    .filters {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filters label {
      font-size: 13px;
      color: var(--ink-2);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filters select {
      font: inherit;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid var(--axis);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 28px 40px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
    }
    .card h2 {
      font-size: 15px;
      margin: 0 0 4px;
      font-weight: 650;
    }
    .card .hint {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 12px;
    }

    /* 主体两列：柱状图 + 排行侧边栏 */
    .grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      align-items: start;
    }

    #winrate-chart { width: 100%; height: 520px; }

    /* 排行侧边栏（同时承担表格视图职责） */
    .rank-list { max-height: 520px; overflow-y: auto; }
    .grade-group { margin-bottom: 10px; }
    .grade-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-2);
      padding: 4px 6px;
      border-bottom: 1px solid var(--grid);
      margin-bottom: 4px;
    }
    .grade-badge {
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 5px;
      font-weight: 700;
      font-size: 12px;
      color: #fff;
    }
    .hero-row {
      display: grid;
      grid-template-columns: 1fr 44px 52px 56px;
      gap: 6px;
      align-items: center;
      padding: 5px 6px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
    }
    .hero-row:hover { background: var(--grid); }
    .hero-row.active { background: var(--seq-150); }
    .hero-row .name { font-weight: 550; }
    .hero-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
    .hero-row .score { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .col-head {
      display: grid;
      grid-template-columns: 1fr 44px 52px 56px;
      gap: 6px;
      padding: 2px 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .col-head span { text-align: right; }
    .col-head span:first-child { text-align: left; }

    /* 趋势面板：两个单指标小多图 */
    .trend-panel {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 20px;
      align-items: start;
    }
    .trend-head {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 8px;
    }
    .trend-hint { grid-column: 1 / -1; }
    .trend-panel .chart { width: 100%; height: 260px; }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 16px 0 32px;
    }
    footer a { color: var(--blue); }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .trend-panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Overwatch 英雄强度看板<span class="subtitle">数据源：暴雪官方英雄数据页 · 每周自动更新</span></h1>
    </div>
    <div class="filters">
      <label>赛季
        <select id="season-select"></select>
      </label>
      <label>段位
        <select id="tier-select"></select>
      </label>
    </div>
  </header>

  <main>
    <!-- 柱状图 + 强度排行 -->
    <div class="grid">
      <section class="card">
        <h2>英雄胜率分布</h2>
        <p class="hint">柱长 = 胜率；柱色深浅 = 出场率（越深出场率越高）。点击柱子查看该英雄历史趋势。</p>
        <div id="winrate-chart"></div>
      </section>

      <aside class="card">
        <h2>强度梯度排行</h2>
        <p class="hint" id="rank-hint">综合强度 = 0.6×胜率 + 0.4×出场率（各自归一化）</p>
        <div class="col-head">
          <span>英雄</span><span>胜率</span><span>出场</span><span>评分</span>
        </div>
        <div class="rank-list" id="rank-list"></div>
      </aside>
    </div>

    <!-- 单英雄历史趋势 -->
    <section class="card trend-panel">
      <div class="trend-head">
        <h2 style="margin:0;">单英雄历史趋势</h2>
        <label style="margin-left:auto;">英雄
          <select id="hero-select"></select>
        </label>
      </div>
      <p class="hint trend-hint">当前段位下该英雄的胜率 / 出场率随快照日期的变化（数据每周累积）。</p>
      <div class="chart" id="trend-winrate"></div>
      <div class="chart" id="trend-pickrate"></div>
    </section>
  </main>

  <footer>
    作品展示项目 · 数据由 GitHub Actions 每周自动抓取并更新 · 详见项目 README
  </footer>

  <script>
    // =====================================================================
    // 看板逻辑
    // =====================================================================
    const DATA_URL = 'data/dashboard_data.json';

    // 页面全局状态
    let DATA = null;
    let state = { season: null, tier: 'All', hero: null };

    // 两个 ECharts 实例（柱状图 + 两个趋势小图）
    let barChart, winChart, pickChart;

    // 顺序色阶：出场率（浅→深）与强度梯度（D→S 深）共用同一蓝色阶
    const SEQ = ['#b7d3f6', '#86b6ef', '#5598e7', '#2a78d6', '#184f95', '#0d366b'];
    // 梯度 S/A/B/C/D -> 色阶（S 最深、D 最浅，单色单调明度）
    const GRADE_COLOR = { S: '#184f95', A: '#2a78d6', B: '#5598e7', C: '#86b6ef', D: '#b7d3f6' };

    // ---------- 初始化 ----------
    async function init() {
      const resp = await fetch(DATA_URL);
      if (!resp.ok) throw new Error('无法加载数据: ' + DATA_URL + '（本地预览请用 python -m http.server 启动）');
      DATA = await resp.json();

      state.season = DATA.meta.season;
      state.tier = DATA.meta.tiers.includes('All') ? 'All' : DATA.meta.tiers[0];

      populateFilters();
      // 默认选中当前段位综合强度最高的英雄
      state.hero = DATA.tier_data[state.tier][0].hero_id;

      barChart = echarts.init(document.getElementById('winrate-chart'));
      winChart = echarts.init(document.getElementById('trend-winrate'));
      pickChart = echarts.init(document.getElementById('trend-pickrate'));

      bindEvents();
      render();
      window.addEventListener('resize', () => {
        barChart.resize(); winChart.resize(); pickChart.resize();
      });
    }

    // 填充筛选下拉框
    function populateFilters() {
      const seasonSel = document.getElementById('season-select');
      seasonSel.innerHTML = DATA.meta.seasons.map(s => `<option value="${s}">${s}</option>`).join('');
      seasonSel.value = state.season;

      const tierSel = document.getElementById('tier-select');
      const tierNames = { All: '全段位', Bronze: '青铜', Silver: '白银', Gold: '黄金',
                          Platinum: '铂金', Emerald: '翡翠', Diamond: '钻石',
                          Master: '大师', Grandmaster: '宗师' };
      tierSel.innerHTML = DATA.meta.tiers
        .map(t => `<option value="${t}">${tierNames[t] || t}</option>`).join('');
      tierSel.value = state.tier;

      // 英雄下拉：按名称排序
      const heroSel = document.getElementById('hero-select');
      const names = Object.entries(DATA.heroes)
        .map(([id, h]) => ({ id, name: h.name }))
        .sort((a, b) => a.name.localeCompare(b.name));
      heroSel.innerHTML = names.map(n => `<option value="${n.id}">${n.name}</option>`).join('');
    }

    // 事件绑定
    function bindEvents() {
      document.getElementById('tier-select').addEventListener('change', e => {
        state.tier = e.target.value;
        render();
      });
      document.getElementById('season-select').addEventListener('change', e => {
        state.season = e.target.value;
        render();
      });
      document.getElementById('hero-select').addEventListener('change', e => {
        state.hero = e.target.value;
        renderTrend();
        renderRankList(); // 刷新高亮
      });
    }

    function render() {
      renderBar();
      renderRankList();
      renderTrend();
    }

    // ---------- 1. 胜率柱状图（柱色深浅 = 出场率） ----------
    function renderBar() {
      const entries = DATA.tier_data[state.tier] || [];
      // 出场率采用「全局固定」色阶（0 ~ 全局最大值），保证切换段位时颜色含义不变
      const globalMaxPick = maxPickrateAcrossTiers();
      const names = entries.map(e => e.name);
      // 每个数据点：[胜率, 出场率, 原始索引]，visualMap 用第 2 维（出场率）着色
      const data = entries.map((e, i) => [e.winrate, e.pickrate, i]);

      barChart.setOption({
        grid: { left: 44, right: 16, top: 20, bottom: 60 },
        tooltip: {
          trigger: 'item',
          backgroundColor: '#ffffff',
          borderColor: '#e1e0d9',
          textStyle: { color: '#0b0b0b', fontSize: 13 },
          formatter: p => {
            const e = entries[p.data[2]];
            return `<b>${e.name}</b><br/>胜率 ${e.winrate.toFixed(1)}%<br/>出场率 ${e.pickrate.toFixed(1)}%`;
          }
        },
        xAxis: {
          type: 'category', data: names,
          axisLine: { lineStyle: { color: '#c3c2b7' } },
          axisTick: { show: false },
          axisLabel: { color: '#898781', fontSize: 11, rotate: 55, interval: 0 }
        },
        yAxis: {
          type: 'value', name: '胜率 %',
          min: 30, max: 65,
          nameTextStyle: { color: '#898781' },
          axisLine: { show: false },
          splitLine: { lineStyle: { color: '#e1e0d9' } },
          axisLabel: { color: '#898781' }
        },
        visualMap: {
          type: 'continuous', min: 0, max: globalMaxPick,
          dimension: 1,
          inRange: { color: ['#cde2fb', '#0d366b'] },
          orient: 'horizontal', left: 'center', bottom: 0,
          itemWidth: 12, itemHeight: 120,
          text: ['出场率 高', '低'],
          textStyle: { color: '#898781', fontSize: 11 },
          calculable: false
        },
        series: [{
          type: 'bar',
          data,
          barMaxWidth: 22,
          itemStyle: { borderRadius: [3, 3, 0, 0] },
          // 点击柱子 -> 选中该英雄
          emphasis: { itemStyle: { opacity: 0.85 } }
        }]
      }, true);

      // 点击柱状图选中英雄
      barChart.off('click');
      barChart.on('click', p => {
        if (p.data && p.data.length > 2) {
          state.hero = entries[p.data[2]].hero_id;
          document.getElementById('hero-select').value = state.hero;
          renderTrend();
          renderRankList();
        }
      });
    }

    // 计算所有段位中的最大出场率，作为固定色阶上限
    function maxPickrateAcrossTiers() {
      let m = 0;
      for (const t in DATA.tier_data) {
        for (const e of DATA.tier_data[t]) m = Math.max(m, e.pickrate);
      }
      return Math.ceil(m);
    }

    // ---------- 2. 强度梯度排行侧边栏（表格视图） ----------
    function renderRankList() {
      const entries = DATA.tier_data[state.tier] || [];
      const grades = ['S', 'A', 'B', 'C', 'D'];
      const listEl = document.getElementById('rank-list');
      document.getElementById('rank-hint').textContent =
        `综合强度 = 0.6×胜率 + 0.4×出场率（归一化）· 共 ${entries.length} 位英雄`;

      let html = '';
      for (const g of grades) {
        const group = entries.filter(e => e.grade === g);
        if (!group.length) continue;
        html += `<div class="grade-group">`;
        html += `<div class="grade-head"><span class="grade-badge" style="background:${GRADE_COLOR[g]}">${g}</span>${group.length} 位</div>`;
        for (const e of group) {
          const active = e.hero_id === state.hero ? ' active' : '';
          html += `
            <div class="hero-row${active}" data-hero="${e.hero_id}">
              <span class="name">${e.name}</span>
              <span class="num">${e.winrate.toFixed(1)}</span>
              <span class="num">${e.pickrate.toFixed(1)}</span>
              <span class="score">${e.score.toFixed(1)}</span>
            </div>`;
        }
        html += `</div>`;
      }
      listEl.innerHTML = html;

      // 点击英雄行 -> 联动趋势图
      listEl.querySelectorAll('.hero-row').forEach(row => {
        row.addEventListener('click', () => {
          state.hero = row.dataset.hero;
          document.getElementById('hero-select').value = state.hero;
          renderTrend();
          renderRankList();
        });
      });
    }

    // ---------- 3. 单英雄历史趋势（两个单指标小多图，避免双轴） ----------
    function renderTrend() {
      const hero = state.hero;
      const series = (DATA.history[hero] || {})[state.tier] || [];
      const dates = series.map(s => s.date);
      const winrates = series.map(s => s.winrate);
      const pickrates = series.map(s => s.pickrate);
      const heroName = (DATA.heroes[hero] || {}).name || hero;

      // 胜率趋势（蓝）
      winChart.setOption({
        title: { text: '胜率走势 (%)', left: 0, top: 0, textStyle: { fontSize: 13, color: '#52514e', fontWeight: 600 } },
        grid: { left: 44, right: 16, top: 30, bottom: 30 },
        tooltip: {
          trigger: 'axis',
          backgroundColor: '#fff', borderColor: '#e1e0d9',
          textStyle: { color: '#0b0b0b' },
          formatter: ps => {
            const s = series[ps[0].dataIndex];
            return `${dates[ps[0].dataIndex]}<br/>胜率 ${s.winrate.toFixed(1)}%`;
          }
        },
        xAxis: { type: 'category', data: dates, boundaryGap: false,
          axisLine: { lineStyle: { color: '#c3c2b7' } }, axisTick: { show: false },
          axisLabel: { color: '#898781', fontSize: 11 } },
        yAxis: { type: 'value', min: 35, max: 65,
          splitLine: { lineStyle: { color: '#e1e0d9' } }, axisLabel: { color: '#898781' } },
        series: [{
          type: 'line', data: winrates, smooth: true,
          symbol: 'circle', symbolSize: 8, showSymbol: true,
          lineStyle: { color: '#2a78d6', width: 2 },
          itemStyle: { color: '#2a78d6' },
          areaStyle: { color: 'rgba(42,120,214,0.08)' }
        }]
      }, true);

      // 出场率趋势（橙）
      pickChart.setOption({
        title: { text: '出场率走势 (%)', left: 0, top: 0, textStyle: { fontSize: 13, color: '#52514e', fontWeight: 600 } },
        grid: { left: 44, right: 16, top: 30, bottom: 30 },
        tooltip: {
          trigger: 'axis',
          backgroundColor: '#fff', borderColor: '#e1e0d9',
          textStyle: { color: '#0b0b0b' },
          formatter: ps => {
            const s = series[ps[0].dataIndex];
            return `${dates[ps[0].dataIndex]}<br/>出场率 ${s.pickrate.toFixed(1)}%`;
          }
        },
        xAxis: { type: 'category', data: dates, boundaryGap: false,
          axisLine: { lineStyle: { color: '#c3c2b7' } }, axisTick: { show: false },
          axisLabel: { color: '#898781', fontSize: 11 } },
        yAxis: { type: 'value', min: 0, max: 70,
          splitLine: { lineStyle: { color: '#e1e0d9' } }, axisLabel: { color: '#898781' } },
        series: [{
          type: 'line', data: pickrates, smooth: true,
          symbol: 'circle', symbolSize: 8, showSymbol: true,
          lineStyle: { color: '#eb6834', width: 2 },
          itemStyle: { color: '#eb6834' },
          areaStyle: { color: 'rgba(235,104,52,0.08)' }
        }]
      }, true);
    }

    // 启动
    init().catch(err => {
      document.body.innerHTML = `<div style="padding:40px;font-family:system-ui;">${err.message}</div>`;
    });
  </script>
</body>
</html>
